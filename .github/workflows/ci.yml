name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # E2E tests run in the e2e job, so skip downloading the Cypress binary here
          CYPRESS_INSTALL_BINARY: 0

      - name: Lint
        run: npx eslint .

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build-only

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Installs dependencies (with the Cypress binary, cached by the action),
      # builds, serves dist/ on the baseUrl in cypress.config.ts and runs the specs
      - name: Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          build: npm run build-only
          start: npx vite preview --host 127.0.0.1 --port 4173 --strictPort
          wait-on: http://127.0.0.1:4173

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
